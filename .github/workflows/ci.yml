name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: customer_intelligence_test
          POSTGRES_USER: postgres
          # Isolated, ephemeral CI service only. No committed passwords.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d customer_intelligence_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/customer_intelligence_test
      DATABASE_URL: postgresql://postgres@localhost:5432/customer_intelligence_test
      APP_ENV: test
      MODEL_MODE: demo
      BUSINESS_DATE: "2026-09-16"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m scripts.init_db --seed
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=80
      - run: python evals/run_evals.py
      - run: python -m scripts.validate_assets
      - name: Build deployment image
        run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t customer-intelligence:${{ github.sha }} .
      - name: Test full Compose startup and deterministic endpoints
        run: |
          unset DATABASE_URL APP_ENV BUSINESS_DATE
          python scripts/configure_local.py --port 5433
          export POSTGRES_PORT=5433
          docker compose up --build -d --wait --wait-timeout 120
          python scripts/smoke_test.py
      - name: Export verified main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save customer-intelligence:${{ github.sha }} -o deployment-image.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: deployment-image-${{ github.sha }}
          path: deployment-image.tar
          retention-days: 7
      - name: Compose diagnostics and shutdown
        if: always()
        run: |
          if [ -f .env ]; then
            export POSTGRES_PORT=5433
            docker compose ps
            docker compose logs --tail 80
            docker compose down
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: evals/results/latest.json
