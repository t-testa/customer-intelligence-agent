name: Deploy staging
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: azure-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB }}
      AZURE_SCAN_JOB: ${{ vars.AZURE_SCAN_JOB }}
      AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: deployment-image-${{ github.event.workflow_run.head_sha }}
          path: .local/deployment-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish verified image, migrate, deploy revision and smoke-test
        shell: bash
        run: bash scripts/deploy_staging.sh
