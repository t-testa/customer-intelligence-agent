services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: customer_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure_local.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  init:
    build: .
    command: ["python", "-m", "scripts.bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      MODEL_MODE: demo
      BUSINESS_DATE: ${BUSINESS_DATE:-2026-09-16}
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/customer_intelligence
      DATABASE_URL: postgresql://cia_app:${APP_DB_PASSWORD:?Local configuration required}@db:5432/customer_intelligence
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ANALYST_DB_PASSWORD: ${ANALYST_DB_PASSWORD:?Local configuration required}

  api:
    build: .
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://cia_app:${APP_DB_PASSWORD}@db:5432/customer_intelligence
      SQL_DATABASE_URL: postgresql://cia_analyst:${ANALYST_DB_PASSWORD}@db:5432/customer_intelligence
      MODEL_MODE: ${MODEL_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      BUSINESS_DATE: ${BUSINESS_DATE:-2026-09-16}
      READER_API_KEY: ${READER_API_KEY:-}
      REVIEWER_API_KEY: ${REVIEWER_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - embedding_cache:/app/.local
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  postgres_data:
  embedding_cache:
